appId: com.dshlauncher.desktop
productName: DSH启动器
copyright: 基于 DeepSeek Harness 构建的非官方桌面客户端

directories:
  output: release
  # 必须是 build（默认值）：nsis.include 与其他构建资源都相对它解析。
  # 指到 resources 会让 electron-builder 去找 resources/build/installer.nsh，
  # 找不到就静默跳过——安装包照常生成，只是自定义安装逻辑从未编进去。
  buildResources: build

files:
  - out/**
  - package.json

# 内置运行时与 dsh 副本必须放在 asar 之外：
# node.exe 需要作为真实文件被 spawn，dsh 的依赖树也需要真实的 node_modules 结构。
#
# dsh 这一条的 from 必须直指 node_modules 本身，不能写成父目录 resources/dsh-bundled。
# electron-builder 会丢弃直接位于 from 根下的 node_modules，产出的 dsh-bundled 是个
# 空目录，而打包过程零报错、零警告——安装包照常生成，只是装完一启动就报
# 「内置 dsh 副本不可用」。对照：runtime 那条能带上 node_modules，
# 是因为它嵌在 runtime/node/ 第二层而非根下。
extraResources:
  - from: resources/runtime
    to: runtime
    filter: ['**/*']
  - from: resources/dsh-bundled/node_modules
    to: dsh-bundled/node_modules
    # 排除与本包目标架构（win32-x64）无关的预编译二进制，约 13MB。
    # 只排架构明确不符的，不碰 sharp-wasm32 之类的回退实现——
    # 那是原生模块加载失败时的兜底路径，省那几 MB 不值得赌它用不上。
    #
    # 后半段排掉运行期用不到的文件。这里的收益主要不是体积而是文件数：
    # 复制三万多个小文件本身就是打包耗时的大头（每个写入还要过一遍实时杀毒），
    # 而其中约六成是 sourcemap、类型声明、文档和测试。
    #
    # electron-builder 的 filter 是「后面的模式可以翻转前面的结论」：
    # 先被 ! 排掉的文件，之后再被一条非取反模式匹配到就会重新纳入。
    # 许可证那条正是靠这个机制放回来的，位置不能往前挪。
    filter:
      - '**/*'
      - '!node-pty/prebuilds/win32-arm64/**'
      - '!node-pty/prebuilds/darwin-*/**'
      - '!node-pty/prebuilds/linux-*/**'
      - '!node-pty/third_party/**/win10-arm64/**'
      # sourcemap 与类型声明：Node 运行期一律不读。
      - '!**/*.map'
      - '!**/*.d.ts'
      - '!**/*.d.mts'
      - '!**/*.d.cts'
      # TypeScript 源码。注意 Node 24 默认开启类型擦除、确实能直接跑 .ts，
      # 所以这条不是「绝对安全」——已发布的 npm 包入口几乎都指向编译后的 JS，
      # 但如果哪天 acceptance 报内置 dsh 起不来，先把这四条摘掉验证。
      - '!**/*.ts'
      - '!**/*.tsx'
      - '!**/*.mts'
      - '!**/*.cts'
      # 文档与测试。
      #
      # 这里的目录名不能想当然地加：node_modules 下同名的既可能是包内的测试目录，
      # 也可能是一个真实依赖包。spec 就踩过——@standard-schema/spec 是真包，
      # 被 !**/spec/** 整个清空（只剩靠下面许可证那条捞回的 LICENSE），
      # 而打包零报错、体积正常，只有运行到用它的代码路径才会炸。
      # 它只对应 1 个真正的测试目录，不值得赌，已从列表移除。
      # benchmark 保留：唯一同名的 fast-uri/benchmark 是包内基准目录，没人 require。
      - '!**/*.md'
      - '!**/{test,tests,__tests__,__mocks__}/**'
      - '!**/{example,examples,demo,benchmark,benchmarks}/**'
      - '!**/{CHANGELOG,HISTORY,AUTHORS,CONTRIBUTING}*'
      # 许可证与版权声明必须随分发保留——依赖树里的 MIT/BSD/Apache 都要求
      # 在再分发时附上许可证全文与版权声明。这条放在最后把它们捞回来，
      # 因为上面的 !**/*.md 会连 LICENSE.md 一起排掉。
      - '**/{LICENSE,LICENCE,COPYING,NOTICE}*'
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico

win:
  target:
    - target: nsis
      arch: [x64]
  # 跳过代码签名。本项目没有签名证书，这道工序不产生任何结果，
  # 却要对 dsh 依赖树里的每个 exe（node-pty 的 OpenConsole.exe、
  # ripgrep 的 rg.exe 等）逐个调 signtool，纯属白花时间。
  #
  # 注：曾经把"打包卡死"归因于这一步，那是误判——真正原因是 stdio 接在了
  # 会缓冲的管道上，管道写满后进程阻塞在 write()。详见 README「打包」一节。
  # 关掉签名依然是对的，只是它省下的是几秒而非几分钟。
  #
  # 注意它与 signAndEditExecutable 是两回事：后者默认 true，负责用 resedit
  # 给主 exe 写入图标与版本信息，必须保留，关掉会导致 exe 没有图标。
  signExecutable: false
  # 直接给 ICO：里面备了 16~256 各号原生尺寸，任务栏、桌面、文件列表各取所需，
  # 不必由 electron-builder 从单张 PNG 现转——那样小尺寸会被缩放出锯齿。
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH启动器
  # 安装后通知 Shell 刷新图标缓存，否则覆盖安装的桌面快捷方式仍显示旧图标。
  # 路径相对 directories.buildResources（即 build/）解析。
  include: installer.nsh
