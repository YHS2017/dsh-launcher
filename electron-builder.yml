appId: com.dshlauncher.desktop
productName: DSH启动器
copyright: 基于 DeepSeek Harness 构建的非官方桌面客户端

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

# 内置运行时与 dsh 副本必须放在 asar 之外：
# node.exe 需要作为真实文件被 spawn，dsh 的依赖树也需要真实的 node_modules 结构。
# filter 必须显式写成 **/* ：electron-builder 的默认过滤规则会把
# extraResources 里的 node_modules 整个丢掉，产出一个只含 package.json 的
# 空壳目录，安装包能打出来但启动即报「内置 dsh 副本不可用」。
extraResources:
  - from: resources/runtime
    to: runtime
    filter: ['**/*']
  - from: resources/dsh-bundled/node_modules
    to: dsh-bundled/node_modules
    filter: ['**/*']
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH启动器
